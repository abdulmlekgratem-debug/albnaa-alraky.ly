<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F6F9"/>
      <stop offset="100%" stop-color="#E8ECF2"/>
    </linearGradient>
    <linearGradient id="pumiceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="pumiceFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="pumiceSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="pumiceShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#7C2D12" flood-opacity="0.16"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="186" rx="115" ry="14" fill="#000" fill-opacity="0.10"/>

  <g filter="url(#pumiceShadow)">
    <g transform="translate(75, 50)">
      <!-- Isometric Pumice Lightweight Block -->
      <polygon points="0,40 85,0 175,35 90,75" fill="url(#pumiceTop)"/>
      <polygon points="0,40 90,75 90,135 0,100" fill="url(#pumiceFront)"/>
      <polygon points="90,75 175,35 175,95 90,135" fill="url(#pumiceSide)"/>

      <!-- Volcanic porous texture pits -->
      <!-- Top Face Pits -->
      <ellipse cx="45" cy="38" rx="5" ry="3" fill="#C2410C"/>
      <ellipse cx="75" cy="25" rx="6" ry="3.5" fill="#C2410C"/>
      <ellipse cx="110" cy="30" rx="5.5" ry="3" fill="#C2410C"/>
      <ellipse cx="135" cy="45" rx="7" ry="4" fill="#C2410C"/>
      <ellipse cx="95" cy="55" rx="6" ry="3" fill="#C2410C"/>
      <ellipse cx="60" cy="52" rx="4.5" ry="2.5" fill="#C2410C"/>

      <!-- Front Face Pits -->
      <ellipse cx="25" cy="65" rx="4" ry="5.5" fill="#9A3412"/>
      <ellipse cx="55" cy="85" rx="5" ry="7" fill="#9A3412"/>
      <ellipse cx="30" cy="100" rx="3.5" ry="5" fill="#9A3412"/>
      <ellipse cx="75" cy="115" rx="4.5" ry="6" fill="#9A3412"/>
      <ellipse cx="70" cy="75" rx="5" ry="6.5" fill="#9A3412"/>

      <!-- Side Face Pits -->
      <ellipse cx="115" cy="95" rx="4" ry="5.5" fill="#7C2D12"/>
      <ellipse cx="145" cy="70" rx="5" ry="7" fill="#7C2D12"/>
      <ellipse cx="135" cy="110" rx="4.5" ry="6" fill="#7C2D12"/>
      <ellipse cx="160" cy="85" rx="3.5" ry="5" fill="#7C2D12"/>
    </g>
  </g>
</svg>
