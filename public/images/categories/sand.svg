<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F6F9"/>
      <stop offset="100%" stop-color="#E8ECF2"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#E2B774"/>
      <stop offset="40%" stop-color="#CFA058"/>
      <stop offset="100%" stop-color="#8C662B"/>
    </linearGradient>
    <linearGradient id="gravelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="60%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="sandShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#451A03" flood-opacity="0.15"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="186" rx="125" ry="16" fill="#000" fill-opacity="0.10"/>

  <g filter="url(#sandShadow)">
    <!-- Back Aggregate Gravel Pile -->
    <g transform="translate(130, 60)">
      <path d="M10 115 C25 60, 75 25, 110 30 C140 35, 165 75, 175 115 Z" fill="url(#gravelGrad)"/>
      <!-- Gravel stone particles -->
      <polygon points="50,65 62,55 75,68 60,78" fill="#CBD5E1"/>
      <polygon points="85,45 100,38 112,50 95,60" fill="#E2E8F0"/>
      <polygon points="120,60 135,52 148,65 130,75" fill="#94A3B8"/>
      <polygon points="70,85 85,75 98,88 80,98" fill="#64748B"/>
      <polygon points="110,80 128,72 140,86 122,96" fill="#CBD5E1"/>
      <polygon points="145,85 160,76 170,90 152,100" fill="#475569"/>
    </g>

    <!-- Front Golden Construction Sand Mound -->
    <g transform="translate(35, 65)">
      <path d="M10 115 C20 70, 70 30, 115 15 C150 2, 195 45, 230 115 Z" fill="url(#sandGrad)"/>
      
      <!-- Sand shading curves -->
      <path d="M115 15 C135 45, 145 80, 150 115 C130 115, 60 110, 10 115 C45 75, 80 40, 115 15 Z" fill="#EAB308" fill-opacity="0.35"/>
      <path d="M115 15 C150 2, 195 45, 230 115 C190 115, 160 115, 150 115 C145 80, 135 45, 115 15 Z" fill="#713F12" fill-opacity="0.25"/>

      <!-- Individual fine texture grains and pebbles -->
      <circle cx="95" cy="45" r="3" fill="#FEF08A"/>
      <circle cx="120" cy="55" r="2.5" fill="#FEF08A"/>
      <circle cx="80" cy="70" r="3" fill="#CA8A04"/>
      <circle cx="140" cy="75" r="3.5" fill="#78350F"/>
      <circle cx="105" cy="85" r="2.5" fill="#FEF08A"/>
      <circle cx="165" cy="85" r="4" fill="#58240C"/>
      <circle cx="65" cy="95" r="3.5" fill="#CA8A04"/>
      <circle cx="125" cy="98" r="3" fill="#FEF08A"/>
      <circle cx="185" cy="98" r="4" fill="#451A03"/>
    </g>
  </g>
</svg>
