<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F6F9"/>
      <stop offset="100%" stop-color="#E8ECF2"/>
    </linearGradient>
    <linearGradient id="gypsumBag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="bucketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#155E75"/>
    </linearGradient>
    <filter id="gypShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="186" rx="115" ry="14" fill="#000" fill-opacity="0.09"/>

  <g filter="url(#gypShadow)">
    <!-- Gypsum Bag (Left) -->
    <g transform="translate(60, 40) rotate(-6 55 70)">
      <rect x="0" y="0" width="110" height="145" rx="8" fill="url(#gypsumBag)" stroke="#94A3B8" stroke-width="1"/>
      <rect x="0" y="32" width="110" height="35" fill="#0284C7"/>
      <rect x="15" y="44" width="80" height="12" rx="2" fill="#FFFFFF"/>
      <text x="55" y="53" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0369A1" text-anchor="middle">KNAUF GYPSUM</text>
      <!-- Stitched seal -->
      <line x1="8" y1="8" x2="102" y2="8" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="8" y1="138" x2="102" y2="138" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="55" y="105" font-family="sans-serif" font-size="12" font-weight="900" fill="#0F172A" text-anchor="middle">جبس العز</text>
      <text x="55" y="122" font-family="sans-serif" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle">30 KG</text>
    </g>

    <!-- Tile Adhesive Bucket (Right) -->
    <g transform="translate(165, 60)">
      <!-- Bucket body -->
      <polygon points="10,25 90,25 80,125 20,125" fill="url(#bucketGrad)"/>
      <!-- Bucket Rim Top -->
      <ellipse cx="50" cy="25" rx="42" ry="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
      <ellipse cx="50" cy="23" rx="38" ry="7" fill="#F8FAFC"/>
      
      <!-- Label -->
      <rect x="18" y="52" width="64" height="42" rx="3" fill="#FFFFFF"/>
      <text x="50" y="68" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0E7490" text-anchor="middle">كولا لاصق</text>
      <text x="50" y="82" font-family="sans-serif" font-size="11" font-weight="900" fill="#E11D48" text-anchor="middle">C1 / C2</text>

      <!-- Metal Handle -->
      <path d="M12 35 C12 -5, 88 -5, 88 35" fill="none" stroke="#64748B" stroke-width="2.5"/>
    </g>
  </g>
</svg>
